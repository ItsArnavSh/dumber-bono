services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: appdb
    ports:
      - "5433:5432" # non-default port on host side
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: changeme
      CLICKHOUSE_DB: telemetry
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

  vosk:
    image: alphacep/kaldi-en:latest # small English model; swap for another alphacep/kaldi-* image for other languages
    container_name: vosk
    ports:
      - "2700:2700"
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper
    container_name: piper
    restart: unless-stopped
    command: ["--voice", "en_GB-alan-medium"]
    ports:
      - "5000:5000" # HTTP TTS endpoint
      - "10200:10200" # Wyoming protocol
    volumes:
      - piper_data:/data
volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  qdrant_data:
  whisper_models:
  piper_data:
